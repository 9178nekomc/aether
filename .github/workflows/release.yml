name: Build & Release

# 打 tag（如 v2.1.0）时自动构建 fat jar 并创建 GitHub Release，
# 同时可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（例如 v2.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build fat jar
        run: mvn -B clean package -DskipTests

      - name: Verify CLI entrypoint
        run: java -jar target/github-agent.jar --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-agent-jar
          path: target/github-agent.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GitHub AI Agent Pro ${{ github.ref_name }}
          files: |
            target/github-agent.jar
            install.sh
            install.ps1
            install.cmd
          generate_release_notes: true
          body: |
            ## 安装（安装后一条命令即可启动）

            **Windows (PowerShell)**
            ```powershell
            irm https://raw.githubusercontent.com/9178nekomc/github-Agent/main/install.ps1 | iex
            ```

            **macOS / Linux**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/9178nekomc/github-Agent/main/install.sh | bash
            ```

            也可以直接下载本页附带的 `github-agent.jar`，然后：
            ```bash
            java -jar github-agent.jar
            ```

            ## 启动

            ```bash
            cd 你的项目目录
            github-agent          # 首次会询问是否允许访问该工作区，并选择权限模式
            github-agent ~/proj   # 指定工作区
            github-agent -p "..."  # 一次性任务
            ```

            权限模式：`safe`（默认，写操作前确认）/ `strict`（每次调用都确认）/ `yolo`（全自动）。
